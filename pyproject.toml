[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gamecurveprobe"
version = "2.0.0"
description = "WebUI application for probing in-game controller response curves."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" },
]
dependencies = [
  "fastapi>=0.141.1",
  "numpy>=2.2.0",
  "opencv-python>=4.11.0.86",
  "pydantic>=2.13.5",
  "python-multipart>=0.0.32",
  "uvicorn[standard]>=0.52.4",
  "windows-capture>=2.0.1",
]

[project.optional-dependencies]
capture = [
  "dxcam>=0.0.6",
]
controller = [
  "vgamepad>=0.1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=1.4.0",
]

[project.scripts]
gamecurveprobe = "gamecurveprobe.__main__:main"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/gamecurveprobe"]
